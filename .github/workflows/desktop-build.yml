name: Build Windows desktop app

# Builds StationMGR-Setup-<version>.exe on a Windows runner. Download it from this run's
# "Artifacts" section (Actions tab → latest "Build Windows desktop app" run).
#
# A build of desktop/offline is also published as the release desktop-v<version>, with the
# installer as StationMGR-Setup.exe: the web's download page links to the latest release's file
# of that name (lib/platform.js on main). Raise "version" in package.json for a new release; a
# build of the same version replaces that release's installer.
on:
  push:
    branches:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The web station this build links to and the key it checks licences with are in
      # package.json "stationmgr" (webOrigin, licencePublicKey); both are public. Repository
      # variables STATIONMGR_WEB_ORIGIN and NEXT_PUBLIC_DESKTOP_LICENCE_PUBLIC_KEY override them
      # when set (Settings → Secrets and variables → Actions → Variables).
      - name: Point the build at the web station
        shell: bash
        run: |
          if [ -n "${{ vars.STATIONMGR_WEB_ORIGIN }}" ]; then npm pkg set "stationmgr.webOrigin=${{ vars.STATIONMGR_WEB_ORIGIN }}"; fi
          echo "Web station: $(npm pkg get stationmgr.webOrigin)"

      - name: Build installer
        run: npm run dist:win
        env:
          # No code-signing certificate: build an unsigned installer.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NEXT_PUBLIC_DESKTOP_LICENCE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_DESKTOP_LICENCE_PUBLIC_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: StationMGR-Windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Name the installer for the download page
        if: github.ref == 'refs/heads/desktop/offline'
        shell: bash
        run: |
          cp dist/StationMGR-Setup-*.exe dist/StationMGR-Setup.exe
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish the release
        if: github.ref == 'refs/heads/desktop/offline'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.VERSION }}
          name: StationMGR for Windows ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/StationMGR-Setup.exe
