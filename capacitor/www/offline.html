<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StationMGR</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #0f172a; --muted: #475569; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --text: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--muted); font-size: 15px; max-width: 320px; margin: 0 0 24px; }
    button { font: inherit; font-weight: 600; padding: 12px 28px; border: 2px solid var(--accent); background: transparent; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
    <h1>Can’t reach StationMGR</h1>
    <p>Check your internet connection, then try again.</p>
    <button type="button" onclick="location.href='https://stationmgr.site/dashboard'">Try again</button>
  </main>
</body>
</html>
